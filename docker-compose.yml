services:
  db:
    image: mysql:8.0
    container_name: citas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: citas_medicas
      MYSQL_USER: citas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucitas", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: